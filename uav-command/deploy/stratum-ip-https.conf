server {
    listen 80;
    server_name 64.118.128.181;
    location /.well-known/acme-challenge/ {
        root /var/www/stratum-acme;
        try_files $uri =404;
    }
    location / { return 301 https://64.118.128.181$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name 64.118.128.181;
    ssl_certificate /etc/letsencrypt-stratum/live/stratum-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-stratum/live/stratum-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "STRATUM UAV Simulation";
    auth_basic_user_file /etc/nginx/stratum.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    client_max_body_size 4k;
    location / {
        proxy_pass http://127.0.0.1:4174;
        proxy_set_header Host 127.0.0.1:4174;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
