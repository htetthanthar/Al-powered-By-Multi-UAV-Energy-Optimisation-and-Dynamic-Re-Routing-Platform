name: UAV Optimization Engine CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest scipy shapely requests
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --exclude=.venv,venv,node_modules --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity
          flake8 . --exclude=.venv,venv,node_modules --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Generate Synthetic Verification Data
        run: |
          python "All sensor/generate_datasets.py"

      - name: Run Operational Constraint Unit Tests
        env:
          PYTHONPATH: "All sensor"
        run: |
          pytest "All sensor/test_pipeline.py" -v --junitxml=test-results.xml

      - name: Verify MLOps Drift Detection Suite
        env:
          PYTHONPATH: "All sensor"
        run: |
          python "All sensor/retrain_pipeline.py"

  build-docker:
    needs: test-and-validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Container Image
        run: |
          docker build -f Config/Dockerfile -t uav-route-optimization:latest .